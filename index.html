<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitting Gud</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        background: #0d1117;
        color: #e6edf3;
      }
      h1 {
        color: #8b7cf6;
      }
      h2 {
        margin-top: 32px;
        border-bottom: 1px solid #30363d;
        padding-bottom: 6px;
      }
      .highlight {
        font-size: 1.5rem;
        font-weight: bold;
        color: #f0b429;
      }
      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 14px 18px;
        width: 200px;
      }
      .card h3 {
        margin: 0 0 4px;
      }
      .card p {
        margin: 0;
        color: #9da7b3;
      }
    </style>
  </head>
  <body>
    <h1>Gitting Gud!!!</h1>
    <p>A practice repo for learning Git and GitHub.</p>

    <h2>Snack list</h2>
    <ul>
      <li>Nova</li>
      <li>Yumburger</li>
      <li>Ube pie</li>
    </ul>

    <h2>Favorite snack</h2>
    <p class="highlight">Nova</p>

    <h2>Team cards</h2>
    <div class="cards">
      <div class="card">
        <h3>DJ</h3>
        <p>Talks too much about Git.</p>
      </div>

      <!-- Add your card below this line -->
    </div>
  </body>
</html>
